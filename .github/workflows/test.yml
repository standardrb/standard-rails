name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule: [ cron: "42 0 7 * *" ] # https://crontab.guru/#42_0_7_*_*

jobs:
  test:
    runs-on: ubuntu-latest
    strategy: {matrix: {ruby: [ 3.1, 3.2, 3.3, 3.4, '4.0' ]}}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bin/rake
